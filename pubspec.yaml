name: percussion_score_management
description: 打擊樂器與樂譜管理系統 (Percussion Score Management)
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 狀態管理（可依喜好改成 riverpod / bloc 等）
  provider: ^6.0.5

  # HTTP 請求（存取 Google Apps Script / Google 試算表 API）
  http: ^1.2.0

  # 開啟外部瀏覽器或 App（例如開啟 Google 表單）
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true



